# SonarQube configuration for SIP Proyecto
sonar.projectKey=sip_comunidades
sonar.projectName=sip-comunidades
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=backend/apps,frontend/src
sonar.exclusions=**/migrations/**,**/node_modules/**,**/*.pyc,**/__pycache__/**,**/venv/**,**/env/**,**/.git/**,**/coverage/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css,**/fixtures/**,**/media/**,**/staticfiles/**

# Test files location
sonar.tests=backend/apps,frontend/src
sonar.test.inclusions=**/*test*.py,**/*_test.py,**/*.test.js,**/*.spec.js,**/tests/**,**/__tests__/**

# Python coverage
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.coveragePlugin=cobertura

# JavaScript/Vue coverage (if using Vitest/Jest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate settings
sonar.qualitygate.wait=true

# Additional settings for better analysis
sonar.python.version=3.8,3.9,3.10,3.11,3.12,3.13
sonar.javascript.node.maxspace=4096

# Django settings
sonar.django.settings.module=sip.settings

# Coverage exclusions - Archivos que NO deben contar para cobertura
# IMPORTANTE: Estos archivos se excluyen del cálculo de cobertura pero se incluyen en el análisis
sonar.coverage.exclusions=**/tests/**,**/*test*.py,**/*_test.py,**/*.test.js,**/*.spec.js,**/conftest.py,**/migrations/**,**/admin.py,**/apps.py,**/urls.py,**/wsgi.py,**/asgi.py,**/manage.py,**/settings.py,**/__init__.py,**/fixtures/**,**/management/commands/**,**/test/setup.js,**/main.js,**/router/**,**/*.config.js,**/*.config.ts,**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/venv/**,**/env/**,**/.git/**,**/media/**,**/staticfiles/**,**/*.min.js,**/*.min.css

# Code smell settings
sonar.python.pylint.reportPath=pylint-report.xml
sonar.python.bandit.reportPaths=bandit-report.json

# Duplication exclusions
sonar.cpd.exclusions=**/migrations/**,**/node_modules/**,**/venv/**,**/env/**,**/coverage/**,**/dist/**,**/build/**,**/fixtures/**

# Language settings
sonar.language=py,js