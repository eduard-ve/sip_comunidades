# SonarQube configuration for SIP Proyecto
sonar.projectKey=sip_comunidades
sonar.projectName=sip-comunidades
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=backend/apps,frontend/src
sonar.exclusions=**/migrations/**,**/node_modules/**,**/*.pyc,**/__pycache__/**

# Test files
sonar.test.inclusions=**/*test*.py,**/*.test.js,**/*.spec.js

# Python coverage
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.coveragePlugin=cobertura

# JavaScript/Vue coverage (if using Vitest/Jest)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate settings
sonar.qualitygate.wait=true

# Additional settings for better analysis
sonar.python.version=3.8,3.9,3.10,3.11,3.12,3.13
sonar.javascript.node.maxspace=4096

# Django settings
sonar.django.settings.module=sip.settings

# Coverage settings
sonar.coverage.exclusions=**/tests/**,**/*test*.py,**/conftest.py,**/migrations/**,**/admin.py,**/apps.py,**/urls.py,**/wsgi.py,**/asgi.py,**/manage.py

# Code smell settings
sonar.python.pylint.reportPath=pylint-report.xml
sonar.python.bandit.reportPaths=bandit-report.json