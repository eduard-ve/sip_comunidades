<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4DA6FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Escudo más ancho y menos alargado -->
  <path d="M 100 15 L 165 45 L 165 95 C 165 135 100 185 100 185 C 100 185 35 135 35 95 L 35 45 Z" 
        fill="url(#shieldGradient)" 
        stroke="#0D3D7A" 
        stroke-width="2"
        filter="url(#shadow)"/>
  
  <!-- Sombra lateral izquierda para profundidad 3D -->
  <path d="M 100 15 L 100 185 C 100 185 35 135 35 95 L 35 45 Z" 
        fill="rgba(0,0,0,0.15)"/>
  
  <!-- Brillo superior -->
  <ellipse cx="100" cy="50" rx="50" ry="25" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Checkmark/Palomita blanca -->
  <g transform="translate(100, 95)">
    <!-- Primera parte (pequeña hacia abajo) -->
    <line x1="-15" y1="-8" x2="0" y2="12" 
          stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Segunda parte (grande hacia arriba) -->
    <line x1="0" y1="12" x2="32" y2="-18" 
          stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>